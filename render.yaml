services:
  # Servicio Worker para el Agente Autónomo
  - type: worker
    name: openclaw-literary-agent
    env: docker
    region: oregon
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: OPENCLAW_ENV
        value: production
      - key: TZ
        value: Europe/Madrid
